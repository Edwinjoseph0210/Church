<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" className="church-logo" role="img" aria-label="St. Mariam Thresia Syro-Malabar Catholic Church Emblem">
  <!-- Outer Gold Decorative Rim -->
  <circle cx="50" cy="50" r="48" stroke="#B45309" stroke-width="2" fill="#78350F" />
  <circle cx="50" cy="50" r="45" stroke="#FDE68A" stroke-width="1.2" stroke-dasharray="2 1" fill="#451A03" />
  <circle cx="50" cy="50" r="41" stroke="#F59E0B" stroke-width="1.5" fill="#581C87" fill-opacity="0.1" />

  <!-- Inner Radiant Halo -->
  <radialGradient id="haloGrad" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.3" />
    <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.1" />
    <stop offset="100%" stop-color="#451A03" stop-opacity="0" />
  </radialGradient>
  <circle cx="50" cy="50" r="39" fill="url(#haloGrad)" />

  <!-- Radiating Beams of Grace from Cross Center -->
  <g stroke="#FDE68A" stroke-width="0.7" opacity="0.65">
    <line x1="50" y1="20" x2="50" y2="14" />
    <line x1="50" y1="74" x2="50" y2="80" />
    <line x1="23" y1="47" x2="17" y2="47" />
    <line x1="77" y1="47" x2="83" y2="47" />
    <line x1="31" y1="28" x2="26" y2="23" />
    <line x1="69" y1="28" x2="74" y2="23" />
    <line x1="31" y1="66" x2="26" y2="71" />
    <line x1="69" y1="66" x2="74" y2="71" />
  </g>

  <!-- Traditional Syro-Malabar / Mar Thoma Lotus Base -->
  <path d="M50 72 C42 72 36 67 33 63 C38 64 45 66 50 67 C55 66 62 64 67 63 C64 67 58 72 50 72 Z" fill="#F59E0B" />
  <path d="M50 75 C40 75 33 70 30 65 C36 67 43 69 50 70 C57 69 64 67 70 65 C67 70 60 75 50 75 Z" fill="#D97706" />

  <!-- Saint Thomas Cross (Mar Thoma Sliva) Vertical Stem -->
  <path d="M47.5 24 H52.5 V65 H47.5 Z" fill="#FDE68A" />
  <path d="M48.5 25 H51.5 V64 H48.5 Z" fill="#FEF08A" />

  <!-- Horizontal Beam -->
  <path d="M27 44.5 H73 V49.5 H27 Z" fill="#FDE68A" />
  <path d="M28 45.5 H72 V48.5 H28 Z" fill="#FEF08A" />

  <!-- Trefoil Ends - Top -->
  <circle cx="50" cy="22" r="3" fill="#F59E0B" stroke="#FEF08A" stroke-width="0.8" />
  <circle cx="45" cy="23.5" r="2.2" fill="#F59E0B" />
  <circle cx="55" cy="23.5" r="2.2" fill="#F59E0B" />

  <!-- Trefoil Ends - Left -->
  <circle cx="25" cy="47" r="3" fill="#F59E0B" stroke="#FEF08A" stroke-width="0.8" />
  <circle cx="26.5" cy="42" r="2.2" fill="#F59E0B" />
  <circle cx="26.5" cy="52" r="2.2" fill="#F59E0B" />

  <!-- Trefoil Ends - Right -->
  <circle cx="75" cy="47" r="3" fill="#F59E0B" stroke="#FEF08A" stroke-width="0.8" />
  <circle cx="73.5" cy="42" r="2.2" fill="#F59E0B" />
  <circle cx="73.5" cy="52" r="2.2" fill="#F59E0B" />

  <!-- Holy Spirit Dove at Cross Apex -->
  <path d="M50 13 C48 16 46 17 43 17 C46 18 48 20 50 22 C52 20 54 18 57 17 C54 17 52 16 50 13 Z" fill="#FFFFFF" />

  <!-- Central Eucharistic Jewel -->
  <circle cx="50" cy="47" r="4.2" fill="#B45309" stroke="#FEF3C7" stroke-width="1.2" />
  <circle cx="50" cy="47" r="2.5" fill="#DC2626" />
  <circle cx="50" cy="47" r="1" fill="#FEF08A" />

  <!-- Decorative Holy Trinity Stars -->
  <circle cx="34" cy="33" r="1.2" fill="#FEF08A" />
  <circle cx="66" cy="33" r="1.2" fill="#FEF08A" />
  <circle cx="50" cy="79" r="1.2" fill="#FEF08A" />
</svg>
